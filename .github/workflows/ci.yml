name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      min_pass_rate:
        description: "Fail the eval job below this overall pass rate"
        default: "0.85"
      delay:
        description: "Seconds between scenarios (LLM rate limits)"
        default: "10"

jobs:
  tests:
    name: tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [enterprise_mock, agent]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: fieldops
          POSTGRES_DB: fieldops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldops"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests (no LLM key; the live tool tests skip without the mock running)
        run: pytest
        env:
          # Each suite creates and migrates its own *_test database in the service container.
          TEST_DATABASE_URL: >-
            postgresql+psycopg://fieldops:fieldops@localhost:5432/${{
            matrix.service == 'agent' && 'fieldops_agent_test' || 'fieldops_test' }}

  eval-runner:
    name: eval runner unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/agent/requirements*.txt
      - run: pip install -r ../services/agent/requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest test_run_evals.py

  evals:
    name: evals (30 scenarios, real LLM)
    if: github.event_name == 'workflow_dispatch'
    needs: [tests, eval-runner]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the LLM key secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add a GEMINI_API_KEY repository secret to run the evals."
            exit 1
          fi
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Run evals
        run: >-
          docker compose --profile evals run --rm evals
          --delay "${{ inputs.delay }}" --min-pass-rate "${{ inputs.min_pass_rate }}"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200 agent enterprise_mock
