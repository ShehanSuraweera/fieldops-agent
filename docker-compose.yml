services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldops}
      POSTGRES_DB: ${POSTGRES_DB:-fieldops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  enterprise_mock:
    build: ./services/enterprise_mock
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fieldops}:${POSTGRES_PASSWORD:-fieldops}@postgres:5432/${POSTGRES_DB:-fieldops}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fieldops}:${POSTGRES_PASSWORD:-fieldops}@postgres:5432/fieldops_test
      MOCK_API_KEY: ${MOCK_API_KEY:-dev-mock-key}
      SEED_TODAY: ${SEED_TODAY:-}
    ports:
      - "${MOCK_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Phase 2: rules + tools only, so this runs the test suite on demand:
  #   docker compose run --rm agent
  # Phase 3 turns it into the agent API and drops the profile.
  agent:
    build: ./services/agent
    profiles: ["tools"]
    environment:
      MOCK_BASE_URL: http://enterprise_mock:8000
      MOCK_API_KEY: ${MOCK_API_KEY:-dev-mock-key}
      RULES_PATH: /config/rules.yaml
    volumes:
      - ./config:/config:ro
    depends_on:
      enterprise_mock:
        condition: service_healthy

volumes:
  pgdata:
