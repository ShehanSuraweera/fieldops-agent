services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldops}
      POSTGRES_DB: ${POSTGRES_DB:-fieldops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  enterprise_mock:
    build: ./services/enterprise_mock
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fieldops}:${POSTGRES_PASSWORD:-fieldops}@postgres:5432/${POSTGRES_DB:-fieldops}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fieldops}:${POSTGRES_PASSWORD:-fieldops}@postgres:5432/fieldops_test
      MOCK_API_KEY: ${MOCK_API_KEY:-dev-mock-key}
      SEED_TODAY: ${SEED_TODAY:-}
      # Enables POST /admin/reseed, which the eval runner uses. Turn off outside dev and CI.
      MOCK_ADMIN_ENABLED: ${MOCK_ADMIN_ENABLED:-true}
    ports:
      - "${MOCK_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    build: ./services/agent
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fieldops}:${POSTGRES_PASSWORD:-fieldops}@postgres:5432/${POSTGRES_DB:-fieldops}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fieldops}:${POSTGRES_PASSWORD:-fieldops}@postgres:5432/fieldops_agent_test
      MOCK_BASE_URL: http://enterprise_mock:8000
      MOCK_API_KEY: ${MOCK_API_KEY:-dev-mock-key}
      RULES_PATH: /config/rules.yaml
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-agent-key}
      AGENT_NOW: ${AGENT_NOW:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${AGENT_PORT:-8002}:8000"
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      enterprise_mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Eval runner: docker compose run --rm evals [--only ID] [--delay 10] [--min-pass-rate 0.85]
  evals:
    image: fieldops-agent-agent
    build: ./services/agent
    profiles: ["evals"]
    working_dir: /evals
    entrypoint: ["python", "run_evals.py"]
    environment:
      AGENT_URL: http://agent:8000
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-agent-key}
      MOCK_URL: http://enterprise_mock:8000
      MOCK_API_KEY: ${MOCK_API_KEY:-dev-mock-key}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}  # recorded in the report only
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ./evals:/evals
    depends_on:
      agent:
        condition: service_healthy

volumes:
  pgdata:
