[project]
name = "enterprise-mock"
version = "0.1.0"
description = "Mock CRM, FSM and ERP systems for FieldOps Agent"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI's Depends()/Query() defaults are idiomatic.
extend-ignore = ["B008"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations, not the alembic package.
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# conftest must set DATABASE_URL before importing the app.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
